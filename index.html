<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecionando...</title>
    <style>
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>
    <p>Abrindo Shopee...</p>

    <script>
        // ================= EDITE AQUI =================
        // Coloque seu link de afiliado completo aqui
        const SEU_LINK_AFILIADO = "https://s.shopee.com.br/30pdeY1FJc?share_channel_code=1";
        // ==============================================

        function redirecionar() {
            // Adiciona parâmetros extras para garantir o rastreamento (smtt=0.0.9 para mobile)
            let url = SEU_LINK_AFILIADO;
            if (!url.includes("?")) url += "?";
            else url += "&";
            url += "smtt=0.0.9&utm_campaign=affiliates&utm_medium=referral";

            // Tenta abrir o App da Shopee via Deep Link (se instalado)
            window.location.href = url.replace("https://s.shopee.com.br", "shopeesg://");

            // Fallback: Se não abrir o app em 2 segundos, abre no navegador
            setTimeout(function() {
                window.location.replace(url);
            }, 2000);
        }

        // Executa o redirecionamento imediato
        redirecionar();
    </script>
</body>
</html>
